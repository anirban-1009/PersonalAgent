services:
  agent:
    build: .
    container_name: personal-agent-voice-agent
    environment:
      - LIVEKIT_URL=ws://host.docker.internal:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
